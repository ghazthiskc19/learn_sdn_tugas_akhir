topology: hierarchy
controller:
  cmd: python3 SPF/dijkstra_osken_controller.py --verbose

workloads:
  - name: "bulk-download-tcp"
    src: "Host1"
    dst: "Host12"
    type: "throughput"
    proto: tcp
    duration: 8
    start_delay: 2
  
  - name: "udp-burst-stream"
    src: "Host2"
    dst: "Host11"
    type: "udp_burst"
    bitrate: "10M"
    burst_duration: 2
    burst_count: 3
    interval_between: 1
    start_delay: 1

# Multiple concurrent flows to simulate realistic traffic
concurrent_flows:
  - ["Host1", "Host12", "tcp"]
  - ["Host3", "Host11", "udp"]
  - ["Host4", "Host10", "tcp"]

concurrent_duration: 5

# Convergence test: fail and restore a link
events:
  - name: "fail-dist-link"
    action: link-down
    src_switch: "s4"
    dst_switch: "s5"
    at: 5
    duration: 2

trials: 2
output: results/hierarchy
