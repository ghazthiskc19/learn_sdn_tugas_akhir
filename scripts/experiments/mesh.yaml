topology: mesh
controller:
  cmd: python3 SPF/dijkstra_osken_controller.py --verbose

workloads:
  - name: "mesh-tcp-flow"
    src: "Host1"
    dst: "Host8"
    type: "throughput"
    proto: tcp
    duration: 8
    start_delay: 1

events:
  - name: "test-mesh-convergence"
    action: link-down
    src_switch: "s1"
    dst_switch: "s2"
    at: 15
    duration: 3

trials: 2
output: results/mesh
